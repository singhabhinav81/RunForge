services:
  postgres:
    image: postgres:16
    container_name: runforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: runforge
      POSTGRES_USER: runforge
      POSTGRES_PASSWORD: 

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: